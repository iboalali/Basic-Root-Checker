org.gradle.java.home=/home/iboalali/Apps/android-studio/jbr
org.gradle.jvmargs=-Xms2G -Xmx8G -Dfile.encoding\=UTF-8 -XX\:+UseG1GC -XX\:MaxMetaspaceSize=1G -XX\:+HeapDumpOnOutOfMemoryError
# The Kotlin compile daemon is a separate JVM and inherits none of the flags above. With ParallelGC
# in a 4G heap it can wedge in a full-GC loop for hours: orphaned onto systemd, old gen pinned at
# 100%, about one full GC per second freeing nothing, most cores burned, and never throwing
# OutOfMemoryError, so nothing surfaces it. G1 plus headroom avoids the spin, and the heap dump
# makes a future exhaustion diagnosable.
kotlin.daemon.jvmargs=-Xmx6G -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.workers.max=4
kotlin.incremental=true
android.r8.optimizedResourceShrinking=true
android.r8.strictFullModeForKeepRules=true
# Required to apply the com.android.compose.screenshot plugin and enable the screenshotTest
# source set.
android.experimental.enableScreenshotTest=true
org.gradle.tooling.parallel=true
