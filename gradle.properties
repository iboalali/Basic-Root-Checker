org.gradle.java.home=/home/iboalali/Apps/android-studio/jbr
org.gradle.jvmargs=-Xms2G -Xmx8G -Dfile.encoding\=UTF-8 -XX\:+UseG1GC -XX\:MaxMetaspaceSize=1G -XX\:+HeapDumpOnOutOfMemoryError
# The Kotlin compile daemon is a *separate* JVM and inherits none of the flags above. Configured
# inline as -Dkotlin.daemon.jvm.options="-Xmx4G" it silently ran ParallelGC in a 4G heap, and twice on
# 2026-07-31 it wedged in a full-GC loop for hours: orphaned onto systemd, old gen pinned at 100%,
# ~1 full GC/sec freeing nothing, ~12 of 16 cores burned, and never throwing OutOfMemoryError so
# nothing surfaced it. Its own line so it can't be overlooked again; G1 plus headroom avoids the spin,
# and the heap dump makes a future exhaustion diagnosable rather than invisible.
kotlin.daemon.jvmargs=-Xmx6G -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.workers.max=4
kotlin.incremental=true
android.r8.optimizedResourceShrinking=true
android.r8.strictFullModeForKeepRules=true
# Compose Preview Screenshot Testing — required to apply the com.android.compose.screenshot plugin
# and enable the screenshotTest source set.
android.experimental.enableScreenshotTest=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
